# datacli configuration.
#
# Copy this file to `datacli.toml` (which is git-ignored) and edit it, or use the
# shell:  config set data-root <path>
#
# Point datacli at your EODHD raw snapshots. Resolution precedence:
#   EODHD_DATA_ROOT env var  >  datacli.toml [eodhd].data_root  >  ../btest default

[eodhd]
data_root = "C:/path/to/your/data/raw/eodhd"

# ---------------------------------------------------------------------------
# Raw Data Lab (optional; `uv sync --extra lab`). API keys come from the
# environment (ANTHROPIC_API_KEY / OPENAI_API_KEY / ...), never from this file.
# See `lab config` for the resolved view.
# ---------------------------------------------------------------------------
[lab]
default_persona = "analyst"
# cache_dir = ".lab_cache"          # relative to the repo; git-ignored
# allow_python = false              # opt-in restricted code executor (plots/stats).
                                    # Trusted-local convenience, NOT a security sandbox.

[lab.budget]
per_session_usd = 1.00              # hard ceiling; the agent stops when reached
warn_usd = 0.50

[lab.models]                        # tier -> model id (LiteLLM syntax)
local  = "ollama/qwen2.5-coder:7b"  # fits a 12GB GPU; strong at text-to-SQL
cheap  = "openai/gpt-4o-mini"
mid    = "anthropic/claude-sonnet-5"
strong = "anthropic/claude-opus-4-8"

# ---------------------------------------------------------------------------
# News scoring (`score plan|run`): schema-driven scores over the news corpus,
# local-only unless a budget allows paid models. See eodhd/NEWS_SCORING_DESIGN.md.
# Model tiers are shared with [lab.models] (local / cheap / mid / strong,
# embed-local / embed-cheap); pull the local models once:
#   ollama pull qwen2.5-coder:7b ; ollama pull nomic-embed-text
# ---------------------------------------------------------------------------
[scoring]
# llm_model   = "local"          # tier or model id for the llm backend
# embed_model = "embed-local"    # tier or model id for the embed backend
# budget_usd  = 0.0              # 0 = local-only; > 0 allows paid calls up to this per run
# window_days = 90               # default target window for `score plan/run`
# max_symbols = 3                # per-symbol scoring only up to this many target symbols
# cache_dir   = ".llm_cache"     # response cache (relative to the repo)

# ---------------------------------------------------------------------------
# Cloud sync (`sync push --run`): one-way backup of the data root. No passwords
# are stored here — only locations; OAuth tokens are cached under
# ~/.datacli/tokens/ after a one-time browser sign-in. For the Google Drive
# backend, bring your own OAuth client (see storage/GDRIVE_SETUP.md) and
# `uv sync --extra sync`.
# ---------------------------------------------------------------------------
# [sync]
# backend = "gdrive"                              # or "local" (plain copy)
# remote_root = "datacli/eodhd"                   # Drive folder path
# gdrive_client_secrets = "C:/path/to/client_secret.json"
# local_dest = "D:/backup/eodhd"                  # for backend = "local"

# ---------------------------------------------------------------------------
# Macro data adapter (FRED). Needs a free FRED_API_KEY in the environment.
# `macro fetch --run` pulls the registered series (macro/registry.py) into parquet
# and the lab exposes them as `macro` views. Defaults to a `macro` sibling of the
# eodhd data root; override here.
# ---------------------------------------------------------------------------
[macro]
# data_root = "C:/path/to/your/data/raw/macro"

# ---------------------------------------------------------------------------
# FINRA source (daily short sale volume first; see docs/FINRA_SOURCE_DESIGN.md).
# Credentials are FINRA_CLIENT_ID and FINRA_API_KEY in the environment (or the
# Windows user environment), never in this file; the public daily files need
# none. Data defaults to a `finra` sibling of the eodhd data root; override here.
# ---------------------------------------------------------------------------
[finra]
# data_root = "C:/path/to/your/data/raw/finra"

# ---------------------------------------------------------------------------
# Derived positioning datasets (`positioning build --run`): rebuilt from the
# finra and eodhd roots, no network. Defaults to a `positioning` sibling of the
# eodhd data root; override here.
# ---------------------------------------------------------------------------
[positioning]
# data_root = "C:/path/to/your/data/raw/positioning"

# ---------------------------------------------------------------------------
# SEC bulk datasets (`sec fetch --run`): Form 13F data sets from sec.gov. Public,
# no key, but the SEC requires SEC_USER_AGENT (a declared name and contact). Data
# defaults to a `sec` sibling of the eodhd data root; override here.
# ---------------------------------------------------------------------------
[sec]
# data_root = "C:/path/to/your/data/raw/sec"

# ---------------------------------------------------------------------------
# Alpaca market data (`alpaca fetch --run`): the official opening and closing
# auction prints of every US stock and ETF ever in the intraday lane, from 2016
# (SIP feed; see docs/AUCTIONS_AND_LINKAGE_DESIGN.md). The key pair is
# APCA_API_KEY_ID and APCA_API_SECRET_KEY in the environment (or the Windows
# user environment), never in this file. Data defaults to an `alpaca` sibling of
# the eodhd data root. Every setting below is optional; the values shown are
# the defaults.
# ---------------------------------------------------------------------------
[alpaca]
# data_root = "C:/path/to/your/data/raw/alpaca"
# history_start = "2016-01-01"
# symbols_per_request = 100
# max_requests_per_minute = 600        # the key may be shared with a live process
# overlap_days = 3                     # a top-up re-reads the last days (late official-close reports)
# retired_after_days = 10              # no daily price for this long -> ask Alpaca "as of" the last one
# quiet_windows = ["15:30-16:15"]      # no request starts then (New York, Mon-Fri)
# quiet_timezone = "America/New_York"
# symbol_map = { "BRK-B" = "BRK.B" }   # store ticker -> Alpaca symbol, when the dot rule is not enough
# min_coverage = 0.8                   # coverage `ok`: a closing cross on this share of the store's sessions ...
# max_gap_sessions = 20                # ... and no run of more than this many sessions without one
# alias_tolerance = 0.002              # an alias closing cross within 0.2% of the store's close matches
# alias_min_match = 0.9                # share of days an alias must match before it is stored
# Predecessor securities and reviewed gaps: alpaca/auctions_universe.toml (versioned)

# ---------------------------------------------------------------------------
# Derived point-in-time links (`linkage build --run`): ETF betas from the eodhd
# daily lanes, unusual auction value and auction co-spike neighbours from the
# Alpaca auctions. No network. Defaults to a `linkage` sibling of the eodhd data
# root. Every parameter is optional; the values shown are the defaults, and a
# change rebuilds the dataset.
# ---------------------------------------------------------------------------
[linkage]
# data_root = "C:/path/to/your/data/raw/linkage"

[linkage.etf_betas]
# start = "2016-01-01"                 # first month end built
# windows = [63, 252]                  # trading days
# min_obs_share = 0.8
# market = "SPY"
# min_price = 5.0                      # median close over the window
# min_dollar_volume = 1000000.0        # median close * volume over the window
# event_window = 1                     # sessions masked each side of a split ex-date
# max_abs_log_return = 0.5
# max_dividend_yield = 0.25

[linkage.auction_abnormal]
# baseline_window = 63                 # previous auction days in the median
# baseline_min_obs = 40
# sides = ["close", "open"]

[linkage.auction_cospike]
# start = "2017-01-01"
# side = "close"
# window = 252
# min_overlap = 150
# top_k = 20
# clip = 3.0
# spike_threshold = 0.6931471805599453 # ln 2
# include_etfs = true
