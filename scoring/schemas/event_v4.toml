# event_v4 -- built for magnitude, because magnitude is what carries signal.
#
# Evidence behind each change. Measured on 62k scored records joined to prices,
# and on a 1,267-article paired bench run (see NEWS_SCORING_DESIGN.md sec 11-14):
#
# 1. DIRECTION HAS NO FORWARD SIGNAL. Confirmed three independent ways: the
#    per-article edge over 803 committed rows is -0.5pp (p=0.78); the vendor
#    quintile long-short over 2,564 days is +2.0 bps (t=1.27); ours over 11 days
#    is +67 bps (t=1.54). Every significant direction number is contemporaneous --
#    the model reads the session the article lands in and does not predict the
#    next. No model swap changes this: five models agreed on direction 95.6% of
#    the time.
#    => `sentiment` is demoted, not deleted. It works as description and for the
#    same-session read, so it keeps 5 levels instead of 7 -- models used only 5 of
#    the 7 in practice, and never the extremes (|sentiment| >= 0.95 on 1 row in
#    1,267).
#
# 2. MAGNITUDE DOES CARRY SIGNAL, AND IT NEEDS THE MODEL. `materiality` orders the
#    next session's absolute market-adjusted move monotonically across all four
#    levels (155 -> 162 -> 220 -> 286 bps), spread +130 bps, t=6.14. Simply
#    counting a name's articles gets +21 bps and t=-0.29 on the same days -- the
#    free baseline wins the *same* session (t=15.25 over 2,215 days) and has
#    nothing forward. So the model's judgement of *how big* is the thing worth
#    paying for.
#    => v4 spends its complexity budget here. `expected_move` asks directly for
#    the quantity we actually measure, in buckets of realised absolute move,
#    instead of the abstract 4-level "materiality". `materiality_label` is KEPT
#    alongside it so the two are answered in the same call on the same article and
#    the comparison is paired -- if the direct question does not beat the abstract
#    one, that is a finding and v5 drops `expected_move` rather than the reverse.
#
# 3. LABELS, NOT NUMBERS -- unchanged from v3, and the reason is now overwhelming.
#    98.8-100% of *every* model's sentiment answers landed exactly on the anchors
#    the prompt named. An LLM copies the numbers it is shown, so the schema asks
#    for an ordinal label and code maps it to a float via `numeric`/`numeric_as`.
#    Consumers still read `sentiment`, `materiality` and `expected_move` as
#    floats, and every existing view and metric keeps working.
#
# 4. `horizon` WAS THE WORST FIELD AND v2 MADE IT WORSE: 26% -> 39% of articles
#    got no horizon at all (v1 -> v2), because "use n_a when nothing is price
#    relevant" is an escape hatch and models take it. v3 only renamed it to
#    "unclear".
#    => v4 REMOVES the escape hatch. Three values, always one of them. The
#    not-price-relevant case is already carried by `expected_move = none`, so the
#    hatch was redundant as well as harmful.
#
# 5. `summary` is trimmed 240 -> 160 chars. Output tokens set the per-article
#    latency, and the pass this schema is built for is ~13,500 articles.

[schema]
name = "event"
version = 4
description = "Magnitude-first event record: expected absolute move in bucketed sizes (the quantity that actually predicts), materiality kept alongside for a paired comparison, horizon with no escape hatch, sentiment demoted to 5 descriptive levels."
scope = "article+symbol"
max_symbols = 3
text = "title+content"
max_chars = 6000

[prompt]
system = """You are a meticulous financial news analyst. You read one article and fill a fixed JSON record about it. You never invent facts that are not in the text, you keep summaries short and factual, you only ever use the allowed values, and you answer strictly with one JSON object and nothing else."""

instructions = """Fill the record for the article below.

Your most important judgement is `expected_move`: how far this stock is likely to move because of this news. Everything else supports it.

Rules:
- Base every value only on the article text. If the text does not support a value, use the neutral option and lower `confidence`.
- Every field is a LABEL from its allowed list. Never output a number where a label is asked for, and never invent a label.
- `summary`: one factual sentence -- who did what, with the key number if any.
- `event_type`: choose the CLOSEST class. Use "index_etf_flow" for market wrap-ups, index moves and fund-flow pieces; "economic_data" for macro releases and central-bank actions; "supply_chain" for suppliers, shortages, tariffs, logistics; "competition" for market-share and rivalry stories; "partnership" for alliances, integrations, joint ventures; "technical_analysis" for chart/price-level commentary; "market_commentary" for opinion about a stock with no new event.
- `price_move_mentioned`: true if the article ITSELF reports that the share price already moved (e.g. "shares fell 8%", "the stock jumped after"). This is about the text, not your opinion.
- `expectation_vs_outcome`: only when the article compares an outcome with an expectation (results vs estimates, guidance vs consensus, a target vs delivery): "beat", "in_line" or "miss". Otherwise "not_applicable".
- `novelty`: true only if the article reports something new (an event, a number, a decision), not commentary on known facts.
- `expected_move`: the size of the move you would expect in the MAIN SUBJECT's share price because of this news, over the horizon you pick below. Judge SIZE ONLY -- ignore whether it is up or down, and ignore moves the whole market makes. A typical stock moves about 1% on an ordinary day, so "under_1pct" means this news adds nothing beyond ordinary noise. Most articles are "none" or "under_1pct". Each bucket, with what belongs in it:
  - "none": no price relevance at all -- listicles, evergreen explainers, incidental mentions, wrap-ups naming many companies.
  - "under_1pct": routine news that is real but small -- ordinary PR, a small contract, a product update, an analyst note with no rating change, results exactly as expected.
  - "1_to_3pct": a genuine new fact that changes the near-term picture modestly -- a rating change with a new target, a mid-size contract or acquisition, a small guidance tweak, results modestly above or below expectations, a new product with real revenue attached.
  - "3_to_7pct": a clear surprise that re-rates the near-term outlook -- earnings or guidance clearly away from expectations, a large deal or divestment, an unexpected CEO departure, a significant regulatory decision, a major customer won or lost, a dividend or buyback started or cut.
  - "over_7pct": news that re-prices the company outright -- a takeover or merger bid, fraud or accounting failure, a failed trial or rejected approval, a collapse in guidance, bankruptcy risk, a going-concern warning.
  If the article already reports the move (see `price_move_mentioned`), judge what is left to come, not what has already happened.
- `materiality`: separately, how much this could move the main subject's price on a 4-step scale. MOST ARTICLES ARE "none" OR "minor". "none" = no price relevance (listicle, evergreen explainer, incidental mention, wrap-up naming many companies). "minor" = routine PR, small contract, product update, analyst note with no rating change. "meaningful" = earnings roughly in line, guidance reiterated, mid-size deal, rating change. "major" = earnings surprise, guidance change, large M&A, regulatory action, CEO exit, balance-sheet-changing financing.
- `horizon`: when the move you expect would happen. "days" = it plays out immediately. "weeks" = it takes a few reporting cycles or news follow-ups. "quarters" = it shows up in future results. Always choose one of the three, even for news you judged immaterial -- pick the horizon the event would matter over if it mattered at all.
- `sentiment`: the market-relevant tone for the MAIN SUBJECT. "very_negative" = fraud, bankruptcy, collapse. "negative" = miss, guidance cut, lawsuit lost, downgrade. "neutral" = no clear direction or genuinely mixed. "positive" = beat, raise, approval, upgrade. "very_positive" = transformational deal, blow-out quarter.
- `confidence`: how well the text supports the values you gave -- "low", "medium" or "high".
- Per-symbol fields: judge each listed symbol separately. `role`: subject = the article is about it; peer = mentioned as a competitor/comparison; mentioned = incidental. `direction`: the implication for that symbol's price from this article alone. `relevance`: "primary" = the article is mainly about it, "secondary" = a real but smaller part, "incidental" = a passing mention.
- Output exactly one JSON object with keys "article" and "symbols" as specified. No prose, no code fences."""

# ---- article-level fields ---------------------------------------------------
# Order is deliberate: the factual and contextual fields come first so the
# judgement fields that depend on them (`expected_move` above all) are answered
# after the model has committed to what the article actually says.

[[fields]]
name = "summary"
type = "string"
max_length = 160
description = "One factual sentence: who did what, with the key number if any."

[[fields]]
name = "event_type"
type = "enum"
values = ["earnings", "guidance", "m_and_a", "capital_return", "financing", "product", "management", "legal_regulatory", "supply_chain", "competition", "partnership", "economic_data", "macro", "index_etf_flow", "analyst_rating", "technical_analysis", "market_commentary", "other"]
description = "Primary event class -- the CLOSEST allowed class, never a new one."

[[fields]]
name = "price_move_mentioned"
type = "bool"
description = "True if the article itself reports that the share price already moved."

[[fields]]
name = "expectation_vs_outcome"
type = "enum"
values = ["beat", "in_line", "miss", "not_applicable"]
description = "Outcome versus a stated expectation, when the article makes that comparison."

[[fields]]
name = "novelty"
type = "bool"
description = "True if the article reports something new rather than commenting on known facts."

[[fields]]
name = "expected_move_label"
type = "enum"
values = ["none", "under_1pct", "1_to_3pct", "3_to_7pct", "over_7pct"]
# Bucket midpoints as decimal returns, so `expected_move` is directly comparable
# with a realised |return|. "none" is 0 rather than a small number because it
# means "this news implies nothing", not "a very small move".
numeric = { none = 0.0, under_1pct = 0.005, "1_to_3pct" = 0.02, "3_to_7pct" = 0.05, over_7pct = 0.10 }
numeric_as = "expected_move"
description = "Expected absolute price move for the main subject, ignoring direction and the market's own move (ordinal label; mapped to a decimal return in `expected_move`)."

[[fields]]
name = "materiality_label"
type = "enum"
values = ["none", "minor", "meaningful", "major"]
numeric = { none = 0.0, minor = 1.0, meaningful = 2.0, major = 3.0 }
numeric_as = "materiality"
description = "Potential price impact on a 4-step scale; kept alongside expected_move for a paired comparison."

[[fields]]
name = "horizon"
type = "enum"
values = ["days", "weeks", "quarters"]
description = "When the expected move would happen. No escape hatch -- v2's optional 'n_a' drew 39% of answers."

[[fields]]
name = "sentiment_label"
type = "enum"
values = ["very_negative", "negative", "neutral", "positive", "very_positive"]
numeric = { very_negative = -1.0, negative = -0.6, neutral = 0.0, positive = 0.6, very_positive = 1.0 }
numeric_as = "sentiment"
description = "Market-relevant tone for the main subject (ordinal label; mapped to a number in `sentiment`). Descriptive: it does not predict the next session."

[[fields]]
name = "confidence_label"
type = "enum"
values = ["low", "medium", "high"]
numeric = { low = 0.3, medium = 0.6, high = 0.9 }
numeric_as = "confidence"
description = "How well the text supports the values given."

# ---- per-symbol fields (only for target symbols, <= max_symbols) --------------

[[symbol_fields]]
name = "role"
type = "enum"
values = ["subject", "peer", "mentioned"]
description = "subject = article is about it; peer = competitor/comparison; mentioned = incidental."

[[symbol_fields]]
name = "direction"
type = "enum"
values = ["up", "down", "neutral", "n_a"]
description = "Price implication for this symbol from this article alone."

[[symbol_fields]]
name = "relevance_label"
type = "enum"
values = ["primary", "secondary", "incidental"]
numeric = { primary = 0.9, secondary = 0.5, incidental = 0.15 }
numeric_as = "relevance"
description = "How much of the article is about this symbol."
