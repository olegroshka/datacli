# event_v2 -- the rich event record, recalibrated from the first 90-day pass.
#
# What changed vs v1 (measured on ~30k articles scored with event@1):
# - event_type: the model kept inventing sensible classes outside the enum
#   (supply_chain, competition, technical_analysis, economic_data, partnership)
#   -> those classes exist now, plus index_etf_flow for market wrap-ups, and the
#   prompt says explicitly to pick the closest class and never invent one.
# - sentiment: v1 quantised to +-0.5 (p10/p50/p90 = -0.5/0.5/0.5) -> anchored
#   seven-point scale with instructions to use the full range.
# - materiality: 82% of articles landed on 2 -> anchored levels with examples and
#   an explicit base rate ("most articles are 0 or 1").
# - horizon: n_a on a third of articles -> n_a only when nothing is price-relevant.
# Everything else (scope, per-symbol fields, JSON shape) is unchanged, so v1 and
# v2 records are directly comparable field by field.

[schema]
name = "event"
version = 2
description = "What happened, to whom, which way (recalibrated): event type incl. supply-chain/competition/partnership/technical/economic-data classes, anchored sentiment and materiality scales, per-symbol relevance/direction."
scope = "article+symbol"
max_symbols = 3
text = "title+content"
max_chars = 6000

[prompt]
system = """You are a meticulous financial news analyst. You read one article and fill a fixed JSON record about it. You never invent facts that are not in the text, you keep summaries short and factual, you only ever use the allowed values, and you answer strictly with one JSON object and nothing else."""

instructions = """Fill the record for the article below.

Rules:
- Base every value only on the article text. If the text does not support a value, use the neutral option ("other", "n_a", 0, false) and lower `confidence`.
- `event_type`: choose the CLOSEST class from the allowed list. Never invent a class. If two apply, pick the one the headline is about. Use "index_etf_flow" for market wrap-ups, index moves and ETF/fund-flow pieces; "economic_data" for macro releases and central-bank actions; "supply_chain" for suppliers, shortages, tariffs and logistics; "competition" for market-share and rivalry stories; "partnership" for alliances, integrations and joint ventures; "technical_analysis" for chart/price-level commentary; "market_commentary" for opinion pieces about a stock without a new event.
- `sentiment` is the market-relevant tone for the MAIN SUBJECT, on a seven-point scale you may interpolate between: -1.0 severe negative (fraud, bankruptcy, collapse), -0.6 clearly negative (miss, cut guidance, lawsuit lost, downgrade), -0.3 mildly negative (soft spot in otherwise routine news), 0.0 neutral or mixed, +0.3 mildly positive, +0.6 clearly positive (beat, raise, approval, upgrade), +1.0 exceptional (transformational deal, blow-out quarter). Use the whole range; do NOT default to +-0.5.
- `materiality` is how much this could move the main subject's price. Base rate: MOST articles are 0 or 1. 0 = no price relevance (listicle, evergreen explainer, incidental mention, market wrap where the company is one of many); 1 = minor (routine PR, small contract, product update, analyst note without a rating change); 2 = meaningful (earnings roughly in line, guidance reiterated, mid-size deal, rating change); 3 = major (earnings surprise, guidance change, large M&A, regulatory action, CEO exit, financing that changes the balance sheet).
- `novelty` is true only if the article reports something new (an event, a number, a decision), not commentary on known facts.
- `horizon`: over what horizon the reported event matters for the price -- "intraday" (a move already happening), "weeks", "quarters", "years"; use "n_a" ONLY when nothing in the article is price-relevant.
- Per-symbol fields: judge each listed symbol separately. `role`: subject = the article is about it; peer = mentioned as a competitor/comparison; mentioned = incidental. `direction`: the implication for that symbol's price from this article alone. `relevance`: how much of the article is about that symbol.
- Output exactly one JSON object with keys "article" and "symbols" as specified. No prose, no code fences."""

# ---- article-level fields ---------------------------------------------------

[[fields]]
name = "event_type"
type = "enum"
values = ["earnings", "guidance", "m_and_a", "capital_return", "financing", "product", "management", "legal_regulatory", "supply_chain", "competition", "partnership", "economic_data", "macro", "index_etf_flow", "analyst_rating", "technical_analysis", "market_commentary", "other"]
description = "Primary event class of the article -- the CLOSEST allowed class, never a new one."

[[fields]]
name = "summary"
type = "string"
max_length = 240
description = "One factual sentence: who did what, with the key number if any."

[[fields]]
name = "sentiment"
type = "float"
min = -1.0
max = 1.0
description = "Market-relevant tone for the main subject on the anchored scale -1.0/-0.6/-0.3/0/+0.3/+0.6/+1.0 (interpolate; use the full range)."

[[fields]]
name = "confidence"
type = "float"
min = 0.0
max = 1.0
description = "How well the text supports the values you gave, 0 to 1."

[[fields]]
name = "materiality"
type = "int"
min = 0
max = 3
description = "0 none (base rate), 1 minor, 2 meaningful, 3 major -- most articles are 0 or 1."

[[fields]]
name = "novelty"
type = "bool"
description = "True if the article reports something new rather than commenting on known facts."

[[fields]]
name = "horizon"
type = "enum"
values = ["intraday", "weeks", "quarters", "years", "n_a"]
description = "Horizon over which the event matters for the price; n_a only if nothing is price-relevant."

# ---- per-symbol fields (only for target symbols, <= max_symbols) --------------

[[symbol_fields]]
name = "role"
type = "enum"
values = ["subject", "peer", "mentioned"]
description = "subject = article is about it; peer = competitor/comparison; mentioned = incidental."

[[symbol_fields]]
name = "direction"
type = "enum"
values = ["up", "down", "neutral", "n_a"]
description = "Price implication for this symbol from this article alone."

[[symbol_fields]]
name = "relevance"
type = "float"
min = 0.0
max = 1.0
description = "How much of the article is about this symbol, 0 to 1."
