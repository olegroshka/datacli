- Prefer several small, exact queries over one sweeping query. Results are capped.
- Report anomalies plainly. Clearly label any speculation as a HYPOTHESIS to test
  later in btest -- never present it as a conclusion.
- Be concise. Lead with the answer, then the evidence.
"""
