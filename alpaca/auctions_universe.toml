# Reviewed exceptions to the auctions universe (alpaca/universe.py).
#
# The store files a company's daily history under one symbol (often today's),
# while Alpaca keys auctions by the security: a predecessor security (a merger,
# a new holding company, an old share line) has its own history under its own
# symbol, or under the same symbol at an earlier `asof`.
#
# [[alias]]  ticker  the store ticker whose span the segment fills
#            symbol  the Alpaca symbol to ask for (dot spelling)
#            until   last day of the segment (inclusive)
#            from    first day (optional: default the ticker's span start)
#            asof    the date Alpaca identifies the security by (optional: default `until`)
#            note    why, and how it was checked
# Every alias was verified on 2026-11-22: the closing cross matched the store's
# daily close within 0.2% on every probed day of a week near each end of the
# segment. The fetcher checks it again on every fetch and refuses a segment
# whose closes match on fewer than [alpaca].alias_min_match of the days.
#
# [[listed]] ticker, auctions_from, note: the store has prices before a US
#            exchange listing (OTC, or abroad), when there are no auctions, or
#            prices of a predecessor that no alias can match.
#            Nothing is fetched before `auctions_from` and coverage starts there.
#
# A retired symbol is asked as of its last daily price, so a change to the
# store's last day (the price fixes overlay dropping placeholder days) can move
# Alpaca's answer to another security. Pin such a ticker here: an alias with an
# explicit `asof`, or a `[[listed]]` start.
#
# [[gap]]    ticker, from, until, note: a reviewed stretch inside the extent
#            with no auctions (OTC between a delisting and a relisting). Its
#            sessions are left out of the coverage measures.

