# Spans where a symbol's 1m bars are a different security from its daily series.
# The fetcher deletes them and never requests them again; members in these spans
# have no bars (missing, not flat).
[[mask]]
ticker = "FI"
until = "2023-06-06"
reason = "Frank's International until 2021-10, then unused; Fiserv traded as FISV, whose 1m history EODHD does not hold"

[[mask]]
ticker = "MTCH"
until = "2020-06-30"
reason = "the old Match Group; the daily series follows the former IAC (the current Match Group)"
